name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Kompilieren, Single-File-Publish und Portable-Version (Windows)
    runs-on: windows-latest

    steps:
      - name: Repository holen
        uses: actions/checkout@v7

      - name: .NET 9 einrichten
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Widget kompilieren
        run: dotnet build SmartWashWidget/SmartWashWidget.csproj -c Release

      - name: Symbol-Werkzeug kompilieren
        run: dotnet build tools/icon-gen/IconGen.csproj -c Release

      - name: Single-File-Build veröffentlichen
        run: >
          dotnet publish SmartWashWidget/SmartWashWidget.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -p:DebugSymbols=false
          -o publish

      - name: Portable-Version paketieren
        run: |
          New-Item -ItemType Directory -Force -Path dist/portable/SmartWashWidget-1.0.0 | Out-Null
          Copy-Item publish/SmartWashWidget.exe dist/portable/SmartWashWidget-1.0.0
          Copy-Item README.md dist/portable/SmartWashWidget-1.0.0
          Copy-Item LICENSE dist/portable/SmartWashWidget-1.0.0
          tar -a --format zip --options "compression-level=9" -c -f dist/SmartWashWidget-Portable-1.0.0-win-x64.zip -C dist/portable SmartWashWidget-1.0.0

      - name: Single-File-Build als Artefakt hochladen
        uses: actions/upload-artifact@v7
        with:
          name: SmartWashWidget-win-x64
          path: publish/
          if-no-files-found: error

      - name: Portable-Version als Artefakt hochladen
        uses: actions/upload-artifact@v7
        with:
          name: SmartWashWidget-portable-win-x64
          path: dist/SmartWashWidget-Portable-1.0.0-win-x64.zip
          if-no-files-found: error
